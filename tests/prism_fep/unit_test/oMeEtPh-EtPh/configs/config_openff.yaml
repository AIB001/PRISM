# General PRISM configuration for oMeEtPh-EtPh system (OpenFF)

fundamental:
  ref: oMeEtPh
  mut: EtPh
  rec: receptor.pdb

model:
  distance: 8
  temperature: 302.15
  concentration: 0.05
  disoff: 1

simulation:
  numofsteps: 500000
  repeats: 4

forcefield:
  # Ligand force field type (gaff, gaff2, openff, cgenff, opls, mmff, match, hybrid)
  type: openff
  # Force field specific parameters
  params:
    forcefield: openff-2.1.0  # OpenFF force field version

other:
  verbose: true
