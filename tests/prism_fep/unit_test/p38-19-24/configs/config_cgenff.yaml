# CGenFF profile for p38-19-24. Requires paired CGenFF website input files
# supplied with --forcefield-path and a CHARMM36 protein force field.

fundamental:
  ref: "19"
  mut: "24"
  rec: protein.pdb

model:
  distance: 8
  temperature: 310
  concentration: 0.15
  disoff: 0

simulation:
  numofsteps: 500000
  repeats: 6

forcefield:
  type: cgenff         # CGenFF force field
  params: {}           # CGenFF charges are pre-assigned

other:
  verbose: true
