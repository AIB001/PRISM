[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F401", "ARG"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# A pytest fixture runs only if the test names it in its signature, so a test
# that sets one up purely for its side effect has to declare an argument it
# never reads. Deleting those to satisfy ARG would switch the fixture off and
# break the test, so the rule cannot apply here.
"tests/**" = ["ARG"]
