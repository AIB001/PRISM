# Portable six-model configuration for a workstation with per-model Conda
# environments.
#
# Unlike the cluster templates in this directory, this file contains no
# machine-specific absolute paths. Two placeholders are expanded when the file
# is loaded, and nothing else is:
#
#   ${PRISM_MODELS_DIR}    the weights directory -- `prism weights path` prints it
#   ${PRISM_WRAPPERS_DIR}  prism/generation/wrappers inside the installed package
#
# Prerequisites:
#   1. prism weights download                  # all six checkpoints, ~966 MiB
#      (PocketXMol arrives inside a 611 MiB publisher bundle, so about 1.3 GiB
#      crosses the wire in total; the bundle is deleted once unpacked)
#   2. git clone --depth 1 <repo> ${PRISM_MODELS_DIR}/<model>/source
#      then `git checkout <model_commit>` -- the commits pinned below are the
#      ones the wrappers were written against
#   3. one Conda environment per model, named prism-gen-<model> by convention
#      (DiffSBDD deliberately reuses prism-gen-molcraft)
#
# PRISM mirrors TargetDiff, Pocket2Mol and MolCRAFT, whose publisher is Google
# Drive; PocketXMol, FLOWR and DiffSBDD are fetched straight from Zenodo. All
# six keep their upstream licences: MolCRAFT is CC BY-NC-SA 4.0 (NonCommercial,
# ShareAlike), the three Zenodo checkpoints are CC BY 4.0, and TargetDiff and
# Pocket2Mol are MIT. `prism weights list` prints the licence and the source per
# artifact.
models:
  targetdiff:
    enabled: true
    backend: conda
    environment: prism-gen-targetdiff
    model_commit: "142f1eb7178480d435fe0b8cb95a99beb48997c7"
    artifacts:
      checkpoint:
        path: "${PRISM_MODELS_DIR}/targetdiff/checkpoints/pretrained_diffusion.pt"
        sha256: "8977821339ba31b7103b46835ef4ddbf7f15f3f2efc5cb1f2a405e7905b09db6"
    command:
      - python
      - "${PRISM_WRAPPERS_DIR}/targetdiff.py"
      - --targetdiff-root
      - "${PRISM_MODELS_DIR}/targetdiff/source"
      - --checkpoint
      - "{checkpoint}"
      - --pocket
      - "{pocket}"
      - --output
      - "{output}"
      - --num-samples
      - "{num_samples}"
      - --seed
      - "{seed}"
      - --device
      - "{device}"
      - --batch-size
      - "10"
    output_patterns: ["raw/sdf/*.sdf"]
    timeout_seconds: 3600

  pocket2mol:
    enabled: true
    backend: conda
    environment: prism-gen-pocket2mol
    model_commit: "836a0c4ce487297ad24bc54ac2ebd163de13242c"
    default_bbox_size: 23.0
    artifacts:
      checkpoint:
        path: "${PRISM_MODELS_DIR}/pocket2mol/checkpoints/pretrained_Pocket2Mol.pt"
        sha256: "e9d8152dfdf034dabf48e566904e9d7c6cc1b96843bdc4d0026d891678913911"
    command:
      - python
      - "${PRISM_WRAPPERS_DIR}/pocket2mol.py"
      - --pocket2mol-root
      - "${PRISM_MODELS_DIR}/pocket2mol/source"
      - --checkpoint
      - "{checkpoint}"
      - --protein
      - "{protein}"
      - --center
      - "{center_x}"
      - "{center_y}"
      - "{center_z}"
      - --bbox-size
      - "{bbox_size}"
      - --output
      - "{output}"
      - --num-samples
      - "{num_samples}"
      - --seed
      - "{seed}"
      - --device
      - "{device}"
      - --beam-size
      - "300"
    output_patterns: ["raw/sdf/*.sdf"]
    timeout_seconds: 7200

  pocketxmol:
    enabled: true
    backend: conda
    environment: prism-gen-pocketxmol
    model_commit: "65488cf635c856101dbe703ac97e2f10f58e005c"
    default_reference_radius: 10.0
    default_center_radius: 15.0
    artifacts:
      checkpoint:
        path: "${PRISM_MODELS_DIR}/pocketxmol/weights/data/trained_models/pxm/checkpoints/pocketxmol.ckpt"
        sha256: "76d918122e598a3c53c77727898659f059d217e680834b7d223b0205c2715c3a"
      train_config:
        path: "${PRISM_MODELS_DIR}/pocketxmol/weights/data/trained_models/pxm/train_config/train.yml"
        sha256: "7225ef261d7bf20afeec6b41760a7dda8608110a37cb3361395ab49c49a0963d"
    command:
      - python
      - "${PRISM_WRAPPERS_DIR}/pocketxmol.py"
      - --pocketxmol-root
      - "${PRISM_MODELS_DIR}/pocketxmol/source"
      - --checkpoint
      - "{checkpoint}"
      - --train-config
      - "{train_config}"
      - --protein
      - "{protein}"
      - --reference-ligand
      - "{reference_ligand}"
      - --center
      - "{center_x}"
      - "{center_y}"
      - "{center_z}"
      - --radius
      - "{pocketxmol_radius}"
      - --output
      - "{output}"
      - --num-samples
      - "{num_samples}"
      - --seed
      - "{seed}"
      - --device
      - "{device}"
      - --batch-size
      - "10"
      - --mode
      - simple
    output_patterns: ["raw/sdf/*.sdf"]
    timeout_seconds: 3600

  molcraft:
    enabled: true
    backend: conda
    environment: prism-gen-molcraft
    model_commit: "743dfb5198c44ca0cec180822bd54258f9d386f1"
    artifacts:
      checkpoint:
        path: "${PRISM_MODELS_DIR}/molcraft/checkpoints/molcraft.ckpt"
        sha256: "0a54f9bfb847ea87e7aec538df90a009c8c49d12a7b5d09947d04b7f9444e024"
    command:
      - python
      - "${PRISM_WRAPPERS_DIR}/molcraft.py"
      - --molcraft-root
      - "${PRISM_MODELS_DIR}/molcraft/source/MolCRAFT"
      - --checkpoint
      - "{checkpoint}"
      - --protein
      - "{protein}"
      - --reference-ligand
      - "{reference_ligand}"
      - --output
      - "{output}"
      - --num-samples
      - "{num_samples}"
      - --seed
      - "{seed}"
      - --device
      - "{device}"
      - --batch-size
      - "16"
      - --sample-steps
      - "100"
      - --sample-num-atoms
      - prior
    output_patterns: ["raw/sdf/*.sdf"]
    timeout_seconds: 3600

  flowr:
    enabled: true
    backend: conda
    environment: prism-gen-flowr
    model_commit: "bbb8bfb4e8d8dd16bff1d56a7f96246920e643ba"
    pocket_cutoff: 6.0
    artifacts:
      checkpoint:
        path: "${PRISM_MODELS_DIR}/flowr/checkpoints/flowr_noHs.ckpt"
        sha256: "1e26e06181fa0d6850a159a12acac36847853f979f76b8fdaa148ed3b502a077"
    command:
      - python
      - "${PRISM_WRAPPERS_DIR}/flowr.py"
      - --flowr-root
      - "${PRISM_MODELS_DIR}/flowr/source"
      - --checkpoint
      - "{checkpoint}"
      - --protein
      - "{protein}"
      - --reference-ligand
      - "{reference_ligand}"
      - --pocket-mode
      - "{flowr_pocket_mode}"
      - --pocket-cutoff
      - "{flowr_pocket_cutoff}"
      - --output
      - "{output}"
      - --num-samples
      - "{num_samples}"
      - --seed
      - "{seed}"
      - --device
      - "{device}"
      - --batch-cost
      - "20"
      - --num-workers
      - "6"
      - --integration-steps
      - "100"
    output_patterns: ["raw/sdf/*.sdf"]
    timeout_seconds: 7200

  diffsbdd:
    enabled: true
    backend: conda
    # DiffSBDD runs in the MolCRAFT environment verbatim; nothing extra is installed.
    environment: prism-gen-molcraft
    model_commit: ""
    artifacts:
      checkpoint:
        path: "${PRISM_MODELS_DIR}/diffsbdd/checkpoints/crossdocked_fullatom_cond.ckpt"
        sha256: "07f86764bf569aafbc40a9c15fc02de8e2550437dd0f17f657eab3abe66c372c"
    command:
      - python
      - "${PRISM_WRAPPERS_DIR}/diffsbdd.py"
      - --diffsbdd-root
      - "${PRISM_MODELS_DIR}/diffsbdd/source"
      - --checkpoint
      - "{checkpoint}"
      - --protein
      - "{protein}"
      - --reference-ligand
      - "{reference_ligand}"
      - --output
      - "{output}"
      - --num-samples
      - "{num_samples}"
      - --seed
      - "{seed}"
      - --device
      - "{device}"
      - --batch-size
      - "10"
    output_patterns: ["raw/sdf/*.sdf"]
    timeout_seconds: 3600
